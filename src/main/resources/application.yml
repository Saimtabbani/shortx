spring:
  application:
    name: shortx

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortx}
    username: ${DB_USERNAME:shortx}
    password: ${DB_PASSWORD:shortx}
    hikari:
      # Sized for a single instance under moderate load. In production this
      # is tuned against (max_connections on Postgres) / (number of instances).
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 1800000
      pool-name: shortx-hikari-pool

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never auto-DDL in any
      # environment — "validate" fails fast if entities and schema drift.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour default TTL, overridden per-cache

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    # Without this, pasting a token into Authorize is lost on every page
    # refresh - a small thing that matters a lot for a demo/portfolio
    # reviewer clicking through the API by hand.
    persistAuthorization: true

shortx:
  base-url: ${SHORTX_BASE_URL:http://localhost:8080}
  # No fixed short-code length here on purpose: generated codes are
  # Base62(Snowflake ID), which naturally comes out to ~10-11 characters
  # for present-day timestamps (see util.SnowflakeIdGenerator /
  # util.Base62Encoder) and grows by roughly one character only every few
  # hundred years as the timestamp component grows. A fixed target length
  # would be meaningless for this scheme - it only applies to a
  # pure-random generation strategy, which this service doesn't use.
  # short_urls.short_code is VARCHAR(20), comfortably ahead of that curve.
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_MIN_256_BITS_LONG_SECRET_KEY}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  rate-limit:
    anonymous:
      capacity: 20
      refill-per-minute: 20
    authenticated:
      capacity: 100
      refill-per-minute: 100
  cache:
    # TTL for the redirect-resolution cache (cache.ShortUrlCacheService).
    # This is a safety net, not the primary invalidation mechanism -
    # direct edits (update/delete) evict immediately; TTL only matters for
    # the one case that doesn't evict on write (the expiry sweep - see
    # scheduler.ExpiredUrlCleanupJob), bounding how stale a cached "still
    # active" answer can ever be.
    short-url-ttl-minutes: 60
  scheduler:
    click-sync:
      # How often pending Redis click counters are flushed into Postgres.
      # Short enough that click_count in the DB/dashboard never looks
      # implausibly stale, long enough that a viral link's redirect
      # traffic isn't generating a bulk-UPDATE every few hundred
      # milliseconds.
      fixed-delay-ms: 30000
    expired-cleanup:
      # Every 5 minutes. Expiry isn't a security boundary that needs
      # second-level precision - a link outliving its expiresAt by up to
      # this interval is an acceptable, documented trade-off.
      cron: "0 */5 * * * *"
  geoip:
    # Points at the writable directory created for the app user in the
    # Dockerfile. The file itself is NOT included in this project - see
    # analytics.GeoIpService's Javadoc for why (MaxMind-licensed binary
    # data, not something to check into source control) and what happens
    # when it's absent (geo analytics disables itself gracefully; nothing
    # else breaks).
    database-path: ${GEOIP_DB_PATH:/app/data/GeoLite2-City.mmdb}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-},userId=%X{userId:-}] - %msg%n"
  level:
    root: INFO
    com.shortx: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
